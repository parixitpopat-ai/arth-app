# Builds an installable DEBUG APK of the current Web app (Web build -> Capacitor -> Gradle).
# It needs nothing on the developer machine: no Android Studio, no local SDK.
#
# Run it: GitHub -> Actions -> "Android debug APK" -> Run workflow (any branch), or push to one of the
# branches listed below (main builds on every push). Download the APK from the run's "Artifacts" section (arth-debug-apk).
#
# Scope: debug build only. No signing key, no release/AAB, no Play Store steps.
name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - wp-android-debug-apk

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8's Android code compiles for Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The GitHub Ubuntu runner already has the Android SDK ($ANDROID_HOME); we only accept its licences so
      # Gradle can fetch any missing platform/build-tools (compileSdk 36). The notices make the SDK state
      # visible in the run's annotations.
      - name: Android SDK licences and diagnostics
        run: |
          echo "::notice title=SDK::ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null 2>&1 || true; else echo "::warning title=SDK::sdkmanager not found at $SDKM"; fi
          echo "::notice title=SDK platforms::$(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=SDK build-tools::$(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
          java -version 2>&1 | head -1 | sed 's/^/::notice title=Java::/'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # The existing production Web build (Vite, base "./"). Cloud-sync settings are the app's own
      # built-in defaults (src/cloudSync.js), exactly as in the Web build.
      - name: Build the Web app
        run: npm run build

      - name: Copy the Web build into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show the APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          # Read the package name and version back out of the built APK itself.
          BADGING=$("$AAPT2" dump badging "$APK" | head -1)
          echo "::notice title=APK package::$BADGING"
          echo "::notice title=APK size::$(stat -c %s "$APK") bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: arth-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
