# Builds an installable DEBUG APK of the current Web app (Web build -> Capacitor -> Gradle).
# It needs nothing on the developer machine: no Android Studio, no local SDK.
#
# Run it: GitHub -> Actions -> "Android debug APK" -> Run workflow (any branch), or push to the
# branches listed below. Download the APK from the run's "Artifacts" section (arth-debug-apk).
#
# Scope: debug build only. No signing key, no release/AAB, no Play Store steps.
name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - wp-android-debug-apk

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8's Android code compiles for Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # The existing production Web build (Vite, base "./"). Cloud-sync settings are the app's own
      # built-in defaults (src/cloudSync.js), exactly as in the Web build.
      - name: Build the Web app
        run: npm run build

      - name: Copy the Web build into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show the APK
        run: |
          ls -l android/app/build/outputs/apk/debug/
          echo "applicationId in this build:"
          grep -n 'applicationId' android/app/build.gradle

      - uses: actions/upload-artifact@v4
        with:
          name: arth-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
